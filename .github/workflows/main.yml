name: Construir KO Trace Android

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar proyecto Android
        run: npx cap add android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Añadir permiso de cámara
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in s:
              s = s.replace("<application", permission + "\n    <application", 1)
          p.write_text(s)
          PY

      - name: Construir Android App Bundle
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: KO-Trace-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
